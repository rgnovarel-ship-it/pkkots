{% extends "base.html" %}

{% block content %}
<div class="shell error-page">
  <div class="error-page__code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p class="hero__lede" style="margin-inline:auto">
    Le lien est peut-être obsolète. Les {{ categories|length }} comparatifs, eux, sont toujours là.
  </p>
  <div class="error-page__actions">
    <a class="btn btn--primary" href="/{{ qs }}">
      Retour à l'accueil
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-right"/></svg>
    </a>
    <a class="btn btn--ghost" href="/methodologie{{ qs }}">Notre méthodologie</a>
  </div>
</div>
{% endblock %}
